# Packaging for Windows (.exe installer), macOS (.dmg) and Linux (AppImage, .deb).
# Build each platform on its own OS (or a CI matrix): ffmpeg/ffprobe and the
# sharp/libvips binaries are installed per-platform by npm.
appId: app.loupe.desktop
productName: Loupe
copyright: Copyright © 2026 Loupe
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - resources/**
  - package.json
  - '!**/*.map'
  - '!**/node_modules/*/{CHANGELOG.md,README.md,readme.md,test,tests,__tests__,docs,example,examples}'
  - '!**/node_modules/sharp/src/**'
asar: true
asarUnpack:
  - '**/node_modules/sharp/**/*'
  - '**/node_modules/@img/**/*'
  - '**/node_modules/ffmpeg-static/**/*'
  - '**/node_modules/@ffprobe-installer/**/*'
electronDist: node_modules/electron/dist
npmRebuild: false
# No auto-update server; installers are distributed directly.
publish: null

fileAssociations:
  - ext: [jpg, jpeg, png, webp, gif, avif, bmp, tif, tiff, heic, heif]
    name: Image
    description: Image
    role: Viewer
  - ext: [dng, cr2, cr3, nef, arw, orf, rw2, raf, pef, srw]
    name: RAW Photo
    description: Camera RAW photo
    role: Viewer
  - ext: [mp4, m4v, mov, mkv, webm, avi, mts, m2ts, 3gp]
    name: Video
    description: Video
    role: Viewer

win:
  target:
    - target: nsis
      arch: [x64, arm64]
  icon: build/icon.png
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Loupe
  installerSidebar: build/installerSidebar.bmp
  uninstallerSidebar: build/installerSidebar.bmp
  artifactName: Loupe-Setup-${version}-${arch}.${ext}

mac:
  target:
    - target: dmg
      arch: [arm64, x64]
  category: public.app-category.photography
  icon: build/icon.png
  hardenedRuntime: true
  extendInfo:
    NSPhotoLibraryUsageDescription: Loupe only reads photos you choose to import.
dmg:
  artifactName: Loupe-${version}-${arch}.${ext}

linux:
  target: [AppImage, deb]
  category: Graphics
  executableName: loupe
  icon: build/icon.png
  synopsis: Private photo & video library
  description: A local-first photo and video library. Everything stays on your computer.
  mimeTypes:
    - image/jpeg
    - image/png
    - image/webp
    - image/gif
    - image/avif
    - image/bmp
    - image/tiff
    - image/heic
    - image/heif
    - video/mp4
    - video/quicktime
    - video/x-matroska
    - video/webm
    - video/x-msvideo
  desktop:
    entry:
      StartupWMClass: Loupe
appImage:
  artifactName: Loupe-${version}-${arch}.${ext}
deb:
  artifactName: loupe_${version}_${arch}.${ext}
